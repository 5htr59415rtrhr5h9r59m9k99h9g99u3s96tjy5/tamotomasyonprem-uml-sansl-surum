<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lüks Düğün Davetiyesi</title>
    <link rel="icon" href="../logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* YENİ RENK PALETİ: AÇIK TONLAR, ALTIN VE MOR */
            --bg-color: #FAF8F5;
            /* Açık Fildişi / Krem */
            --card-bg: #FFFFFF;
            /* Bembeyaz Kart */
            --gold-light: #F9E5A0;
            --gold: #D4AF37;
            /* Premium Altın */
            --gold-dark: #AA8222;
            --purple-light: #9B729D;
            --purple-mid: #5D2E5F;
            /* Temel Mor */
            --purple-dark: #311432;
            /* Koyu Lüks Mor */
            --text-dark: #2C2C2C;
            --text-muted: #7A5C7B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Jost', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background-image: radial-gradient(circle at center, #FFFFFF 0%, #FAF8F5 100%);
        }

        /* ========== PARÇACIK ANİMASYONU ========== */
        .particles-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50% !important;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        .particle.gold {
            background: var(--gold);
            box-shadow: 0 0 10px 3px rgba(212, 175, 55, 0.4);
        }

        .particle.purple {
            background: var(--purple-light);
            box-shadow: 0 0 10px 3px rgba(155, 114, 157, 0.4);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform: translateY(40vh) translateX(30px) scale(1.5);
                opacity: 0.8;
            }

            90% {
                opacity: 0;
            }

            100% {
                transform: translateY(-10vh) translateX(-20px) scale(0);
                opacity: 0;
            }
        }

        /* ========== LÜKS ÇİFT KAPI (GİRİŞ EKRANI) ========== */
        .intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            /* 3D Efekti için */
            overflow: hidden;
            background: var(--bg-color);
        }

        .door {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid));
            border: 5px solid var(--gold);
            transition: transform 2s cubic-bezier(0.77, 0, 0.175, 1), opacity 2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 0, 0, 0.4);
            z-index: 101;
        }

        /* Kapıların üzerindeki altın desenler */
        .door::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 90%;
            border: 2px dashed var(--gold-light);
            opacity: 0.4;
        }

        .door-left {
            left: 0;
            transform-origin: left;
            border-right-width: 2.5px;
        }

        .door-right {
            right: 0;
            transform-origin: right;
            border-left-width: 2.5px;
        }

        /* Kapılar açılırken tetiklenecek class */
        .door-left.open {
            transform: rotateY(-105deg);
            opacity: 0;
        }

        .door-right.open {
            transform: rotateY(105deg);
            opacity: 0;
        }

        .intro-content {
            position: absolute;
            z-index: 102;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            /* Sadece butona tıklanabilsin diye */
        }

        .intro-names {
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(4rem, 15vw, 7rem);
            color: var(--gold-light);
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
            text-align: center;
            animation: pulseGold 3s infinite alternate;
        }

        @keyframes pulseGold {
            from {
                text-shadow: 0 0 10px rgba(249, 229, 160, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            }

            to {
                text-shadow: 0 0 20px rgba(249, 229, 160, 0.9), 0 0 40px rgba(212, 175, 55, 0.6);
            }
        }

        .tap-btn {
            pointer-events: auto;
            /* Tıklanabilir */
            background: rgba(49, 20, 50, 0.8);
            border: 2px solid var(--gold);
            color: var(--gold-light);
            padding: 15px 40px;
            font-family: 'Jost', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.4s;
            backdrop-filter: blur(5px);
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }

        .tap-btn:hover {
            background: var(--gold);
            color: var(--purple-dark);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
        }

        /* ========== ANA KART VE IŞIK SÜZMESİ ========== */
        .card-container {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease 1s;
            /* Kapılar açıldıktan sonra gelsin */
        }

        .card-container.revealed {
            opacity: 1;
            pointer-events: auto;
        }

        /* Işık Süzmesi Çerçevesi (Animated Gradient Border) */
        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 4px;
            /* Işık süzmesinin kalınlığı */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(49, 20, 50, 0.15);
            transform-origin: center center;
            will-change: transform;
        }

        /* Etrafta dönen ışık efekti */
        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent,
                    transparent,
                    transparent,
                    var(--gold),
                    var(--purple-mid),
                    transparent,
                    transparent);
            animation: borderBeam 4s linear infinite;
            z-index: 0;
        }

        @keyframes borderBeam {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .main-card {
            position: relative;
            z-index: 1;
            /* Işığın önünde dursun */
            background: var(--card-bg);
            border-radius: 16px;
            /* Wrapper'dan biraz küçük */
            padding: clamp(25px, 5vh, 40px) 25px;
            text-align: center;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><g fill="%23D4AF37" fill-opacity="0.03"><path d="M50 0L55 45L100 50L55 55L50 100L45 55L0 50L45 45Z"/></g></svg>');
        }

        .top-label {
            font-family: 'Jost', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 8px;
            color: var(--purple-mid);
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .couple-title {
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(3.5rem, 13vw, 5.5rem);
            color: var(--purple-dark);
            line-height: 0.8;
            margin-bottom: 25px;
        }

        .ampersand {
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.6em;
            display: inline-block;
            margin: 0 5px;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 20px;
            width: 70%;
            position: relative;
        }

        .divider::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--gold);
            background: var(--card-bg);
            padding: 0 10px;
            font-size: 1.2rem;
        }

        .families-section {
            margin-bottom: 20px;
        }

        .families-names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.4;
        }

        .parent-group {
            display: inline-block;
            margin: 0 10px;
        }

        .label-small {
            font-family: 'Jost', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: var(--purple-light);
            display: block;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .events-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .event-block {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .event-block:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: scale(1.02);
        }

        .event-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--purple-dark);
            margin-bottom: 5px;
            font-style: italic;
        }

        .event-date {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .countdown-label {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--purple-mid);
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .cd-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
            position: relative;
        }

        .cd-box span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold-dark);
            line-height: 1;
        }

        .cd-box small {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--purple-mid);
            margin-top: 5px;
            font-weight: 500;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--purple-mid);
            color: var(--purple-dark);
            padding: 15px;
            font-size: 0.85rem;
            font-family: 'Jost', sans-serif;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 30px;
        }

        .btn-solid {
            background: var(--gold);
            color: var(--card-bg);
            border-color: var(--gold);
        }

        .btn:hover {
            background: var(--purple-dark);
            color: var(--card-bg);
            border-color: var(--purple-dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(49, 20, 50, 0.2);
        }

        .btn-solid:hover {
            background: var(--gold-dark);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        /* ========== HARİTA PANELİ ========== */
        .map-panel {
            position: fixed;
            inset: 0;
            z-index: 110;
            background: rgba(250, 248, 245, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(50px);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .map-panel.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .map-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .map-iframe {
            width: 100%;
            height: 300px;
            border: none;
            border-radius: 10px;
            margin: 15px 0;
            background-color: #EEE;
        }

        /* ========== MOBİL DÜZELTMELERİ ========== */
        @media (max-width: 480px) {
            .couple-title {
                font-size: clamp(3rem, 14vw, 4.5rem);
            }

            .families-names {
                font-size: 1.1rem !important;
            }

            .parent-group {
                margin: 0 5px !important;
            }

            .cd-box span {
                font-size: 1.8rem;
            }

            .cd-box {
                min-width: 50px;
            }

            .event-title {
                font-size: 1.2rem;
            }

            .main-card {
                padding: 25px 15px !important;
            }

            .intro-names {
                font-size: clamp(3.5rem, 16vw, 5rem);
            }
        }
    </style>
</head>

<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="sn7.mp3" type="audio/mpeg">
    </audio>

    <div class="particles-container" id="particlesContainer"></div>

    <div class="intro-overlay" id="introOverlay">
        <div class="door door-left" id="doorLeft"></div>
        <div class="door door-right" id="doorRight"></div>

        <div class="intro-content">
            <h1 class="intro-names" id="introNames"> </h1>
            <button class="tap-btn" id="tapBtn">DAVETİYEYİ AÇ</button>
        </div>
    </div>

    <div class="card-container" id="cardContainer">
        <div class="card-wrapper" id="cardWrapper">
            <div class="main-card">
                <div class="top-label" id="kartBaslik">BİZ EVLENİYORUZ</div>
                <h2 class="couple-title">
                    <span id="gelinAd"> </span>
                    <span class="ampersand">&</span>
                    <span id="damatAd"> </span>
                </h2>

                <div class="divider"></div>

                <div class="families-section" id="familiesSection">
                    <div class="families-names" id="familiesNames"></div>
                </div>

                <div class="events-wrapper">
                    <div class="event-block">
                        <div class="event-title" id="etkinlik1Baslik">Kına Gecesi</div>
                        <div class="event-date" id="etkinlik1Detay">14 Haziran 2027, Cumartesi - 19:00</div>
                        <div class="event-date" id="etkinlik1Konum"
                            style="margin-top:5px; color:var(--purple-muted); font-size: 0.75rem;"></div>
                    </div>
                    <div class="event-block">
                        <div class="event-title" id="etkinlik2Baslik">Düğün Töreni</div>
                        <div class="event-date" id="etkinlik2Detay">15 Haziran 2027, Pazar - 19:30</div>
                        <div class="event-date" id="etkinlik2Konum"
                            style="margin-top:5px; color:var(--purple-muted); font-size: 0.75rem;"></div>
                    </div>
                </div>

                <div class="countdown-label">Düğüne Kalan Süre</div>
                <div class="countdown" id="timer">
                    <div class="cd-box"><span id="days">00</span><small>Gün</small></div>
                    <div class="cd-box"><span id="hours">00</span><small>Saat</small></div>
                    <div class="cd-box"><span id="minutes">00</span><small>Dak</small></div>
                    <div class="cd-box"><span id="seconds">00</span><small>Sn</small></div>
                </div>

                <div class="action-btns">
                    <button id="btnLcv" class="btn btn-solid">Lütfen LCV Bildiriniz</button>
                    <button id="btnMap" class="btn">Haritada Görüntüle</button>
                </div>
            </div>
        </div>
    </div>

    <div class="map-panel" id="mapPanel">
        <div class="map-container">
            <div class="top-label" style="text-align: center; color: var(--gold-dark);">ETKİNLİK ALANI</div>
            <iframe id="haritaIframe" class="map-iframe" src="" allowfullscreen loading="lazy"></iframe>
            <div class="action-btns">
                <button id="btnNavigate" class="btn btn-solid">YOL TARİFİ AL</button>
                <button id="mapClose" class="btn">GERİ DÖN</button>
            </div>
        </div>
    </div>

    <script>
        // ========== DİNAMİK VERİ YÜKLEME ==========
        (function () {
            const params = new URLSearchParams(window.location.search);
            const musteriKodu = params.get("kisi");

            const varsayilan = {
                gelinAd: "Ebru", damatAd: "Mert",
                gelinAnne: "Ayşe", gelinBaba: "Ahmet",
                damatAnne: "Fatma", damatBaba: "Mehmet",
                etkinlik1Baslik: "Kına Gecesi", etkinlik1Tarih: "14 Haziran 2027", etkinlik1Gun: "Cumartesi", etkinlik1Saat: "19:00",
                etkinlik2Baslik: "Düğün Töreni", etkinlik2Tarih: "15 Haziran 2027", etkinlik2Gun: "Pazar", etkinlik2Saat: "19:30",
                konum: "Sait Halim Paşa Yalısı", ilce: "Yeniköy", sehir: "İstanbul",
                haritaIframe: "https://maps.google.com/maps?q=Sait+Halim+Pa%C5%9Fa+Yal%C4%B1s%C4%B1+Yenik%C3%B6y+%C4%B0stanbul&output=embed",
                whatsappNo: "905386082155", whatsappMesaj: "Merhaba, düğününüze katılacağız!",
                geriSayim: "2027-06-15T19:30:00",
                kartBaslik: "BİZ EVLENİYORUZ"
            };

            function sayfayiDoldur(veri) {
                document.getElementById("introNames").textContent = veri.gelinAd + " & " + veri.damatAd;
                document.getElementById("kartBaslik").textContent = veri.kartBaslik || "BİZ EVLENİYORUZ";
                document.getElementById("gelinAd").textContent = veri.gelinAd;
                document.getElementById("damatAd").textContent = veri.damatAd;

                const familiesDiv = document.getElementById("familiesNames");
                let aileHtml = '';
                if (veri.gelinAnne || veri.gelinBaba) {
                    aileHtml += '<div class="parent-group"><span class="label-small">Gelin Ailesi</span>';
                    aileHtml += [veri.gelinAnne, veri.gelinBaba].filter(Boolean).join(' & ') + '</div>';
                }
                if ((veri.gelinAnne || veri.gelinBaba) && (veri.damatAnne || veri.damatBaba)) {
                    aileHtml += '<span style="display:inline-block;margin:0 10px;color:var(--gold);font-size:1.2rem;">✦</span>';
                }
                if (veri.damatAnne || veri.damatBaba) {
                    aileHtml += '<div class="parent-group"><span class="label-small">Damat Ailesi</span>';
                    aileHtml += [veri.damatAnne, veri.damatBaba].filter(Boolean).join(' & ') + '</div>';
                }
                familiesDiv.innerHTML = aileHtml;
                if (!aileHtml) document.getElementById("familiesSection").style.display = "none";

                document.getElementById("etkinlik1Baslik").textContent = veri.etkinlik1Baslik || "Kına Gecesi";
                document.getElementById("etkinlik1Detay").textContent = (veri.etkinlik1Tarih || "14 Haziran 2027") + ", " + (veri.etkinlik1Gun || "Cumartesi") + " - " + (veri.etkinlik1Saat || "19:00");
                document.getElementById("etkinlik1Konum").textContent = veri.konum || "Sait Halim Paşa Yalısı";

                document.getElementById("etkinlik2Baslik").textContent = veri.etkinlik2Baslik || "Düğün Töreni";
                document.getElementById("etkinlik2Detay").textContent = (veri.etkinlik2Tarih || "15 Haziran 2027") + ", " + (veri.etkinlik2Gun || "Pazar") + " - " + (veri.etkinlik2Saat || "19:30");
                document.getElementById("etkinlik2Konum").textContent = veri.konum || "Sait Halim Paşa Yalısı";

                if (veri.haritaIframe) document.getElementById("haritaIframe").src = veri.haritaIframe;

                document.getElementById("btnLcv").addEventListener("click", function () {
                    window.open("https://wa.me/" + veri.whatsappNo + "?text=" + encodeURIComponent(veri.whatsappMesaj), "_blank");
                });
                document.getElementById("btnNavigate").addEventListener("click", function () {
                    const adres = (veri.konum || "Sait Halim Paşa Yalısı") + ", " + (veri.ilce || "Yeniköy") + ", " + (veri.sehir || "İstanbul");
                    window.open("https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(adres), "_blank");
                });

                if (veri.geriSayim) window.geriSayimHedef = new Date(veri.geriSayim).getTime();
            }

            if (musteriKodu) {
                fetch("/data/sn6/" + musteriKodu + ".json")
                    .then(res => res.ok ? res.json() : Promise.reject())
                    .then(veri => sayfayiDoldur(veri))
                    .catch(() => sayfayiDoldur(varsayilan));
            } else {
                sayfayiDoldur(varsayilan);
            }
        })();

        // ========== PARÇACIK EFEKTİ ==========
        (function () {
            const particlesContainer = document.getElementById('particlesContainer');
            const particleColors = ['particle gold', 'particle purple'];

            function createParticle() {
                const particle = document.createElement('div');
                particle.className = particleColors[Math.floor(Math.random() * particleColors.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 8 + 6) + 's';
                particle.style.animationDelay = Math.random() * 2 + 's';

                let size = (Math.random() * 4 + 2) + 'px';
                particle.style.width = size;
                particle.style.height = size;

                particlesContainer.appendChild(particle);

                const duration = parseFloat(particle.style.animationDuration) + parseFloat(particle.style.animationDelay);
                setTimeout(() => { if (particle.parentNode) particle.remove(); }, duration * 1000);
            }
            for (let i = 0; i < 30; i++) setTimeout(() => createParticle(), i * 200);
            setInterval(() => { if (!document.hidden) createParticle(); }, 1500);
        })();

        // ========== ETKİLEŞİMLER + KAPI AÇILIŞI + EKRANA SIĞDIRMA ==========
        (function () {
            const bgMusic = document.getElementById('bgMusic');
            const tapBtn = document.getElementById('tapBtn');
            const introOverlay = document.getElementById('introOverlay');
            const doorLeft = document.getElementById('doorLeft');
            const doorRight = document.getElementById('doorRight');
            const cardContainer = document.getElementById('cardContainer');
            const cardWrapper = document.getElementById('cardWrapper');
            const mapPanel = document.getElementById('mapPanel');
            let countdownInterval;

            // Kartı ekrana sığdırma (Border efekti bozulmasın diye Wrapper ölçeklenir)
            function fitCardToScreen() {
                cardWrapper.style.transform = 'none';

                const containerRect = cardContainer.getBoundingClientRect();
                const cardHeight = cardWrapper.offsetHeight;
                const cardWidth = cardWrapper.offsetWidth;

                const availableHeight = containerRect.height * 0.92;
                const availableWidth = containerRect.width * 0.92;

                let scaleY = availableHeight / cardHeight;
                let scaleX = availableWidth / cardWidth;

                let scale = Math.min(scaleY, scaleX, 1);
                scale = Math.max(scale, 0.5);

                if (scale < 1) {
                    cardWrapper.style.transform = `scale(${scale})`;
                }
            }

            // KAPIYI AÇMA TIKLAMASI
            tapBtn.addEventListener('click', () => {
                bgMusic.play().catch(() => { });

                // Kapıları ve yazıyı anime et
                document.querySelector('.intro-content').style.opacity = '0';
                doorLeft.classList.add('open');
                doorRight.classList.add('open');

                // Z-index olayını çözüp arka planı gizlemek için zamanlayıcı
                setTimeout(() => {
                    introOverlay.style.pointerEvents = 'none';
                    introOverlay.style.display = 'none';
                    cardContainer.classList.add('revealed');
                    fitCardToScreen();
                    startCountdown();
                }, 1800); // Kapı animasyonu bitmeye yakın
            });

            // Harita Modalı
            document.getElementById('btnMap').addEventListener('click', () => {
                cardContainer.style.opacity = '0';
                setTimeout(() => mapPanel.classList.add('active'), 300);
            });
            document.getElementById('mapClose').addEventListener('click', () => {
                mapPanel.classList.remove('active');
                setTimeout(() => {
                    cardContainer.style.opacity = '1';
                    fitCardToScreen();
                }, 300);
            });

            // Geri sayım
            function startCountdown() {
                if (countdownInterval) clearInterval(countdownInterval);
                const target = window.geriSayimHedef || new Date("2027-06-15T19:30:00").getTime();
                function update() {
                    const diff = target - Date.now();
                    if (diff > 0) {
                        document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                        document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                        document.getElementById('minutes').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                        document.getElementById('seconds').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                    } else {
                        ['days', 'hours', 'minutes', 'seconds'].forEach(id => document.getElementById(id).innerText = '00');
                    }
                }
                update();
                countdownInterval = setInterval(update, 1000);
            }

            // Ekran boyutu değiştiğinde
            window.addEventListener('resize', () => {
                if (cardContainer.classList.contains('revealed')) fitCardToScreen();
            });
            window.addEventListener('orientationchange', () => {
                setTimeout(() => {
                    if (cardContainer.classList.contains('revealed')) fitCardToScreen();
                }, 300);
            });
        })();
    </script>
</body>
